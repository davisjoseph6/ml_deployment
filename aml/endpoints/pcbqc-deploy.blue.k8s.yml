# aml/endpoints/pcbqc-deploy.blue.k8s.yml
$schema: https://azuremlschemas.azureedge.net/latest/kubernetesOnlineDeployment.schema.json

type: kubernetes

name: blue
endpoint_name: pcbqc-endpt

# ---------------------------------------------------------
# “Code + environment” approach
# NOTE: For your cluster, code_configuration did not appear as a volume mount in the Pod.
# We still keep it so AML sets the right env vars, but scoring is baked into the image.
# ---------------------------------------------------------
code_configuration:
  code: ../scoring
  scoring_script: score.py

environment:
  # Replace this with your NEW pushed tag
  # e.g. acrpcbqc19589.azurecr.io/pcbqc-aml-infer:<your_tag_here>
  image: acrpcbqc19589.azurecr.io/pcbqc-aml-infer:4884c5a-amlfix2

model: azureml:pcbqc-yolo-seg:1
model_mount_path: /var/azureml-app/model

environment_variables:
  # Explicit/clear model location
  PCBQC_YOLO_WEIGHTS: /var/azureml-app/model/best.pt
  YOLO_DEVICE: cpu

  # (Optional but harmless) make AML intent explicit
  AML_APP_ROOT: /var/azureml-app/scoring
  AZUREML_ENTRY_SCRIPT: score.py

instance_type: cpu2-6g
instance_count: 1

request_settings:
  request_timeout_ms: 60000
  max_concurrent_requests_per_instance: 1

